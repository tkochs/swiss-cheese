[package]
name = "swiss_cheese"
version = "0.1.6"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "swiss_cheese"
crate-type = ["cdylib"]

[dependencies]
ndarray = "0.17.2"
ndarray-stats = "0.7.0"
numpy = "0.29.0"
pyglue = "0.1.1"
pyo3 = { version = "0.29.1", features = ["extension-module"] }
rand = "0.10.1"
rayon = "1.12.0"
threadpool = "1.8.1"
