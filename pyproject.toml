[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "swiss_cheese"
description = "Missing Value generation library for research purposes."
readme = "README.md"
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

dependencies = [
    "pandas>=2.3",
    "numpy>=2.4",
    "scikit-learn>=1.9.0",
]

[tool.maturin]
python-source = "."

[dependency-groups]
dev = [
    "maturin>=1.13.3",
    "pytest>=9.0.3",
    "pandas-stubs>=3.0.0.260204",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]


[tool.pytest.ini_options]
addopts = "-m 'not visualize'"
markers = [
    "visualize: tests that generate visualization images",
    "heavy: slow or resource-intensive tests",
]
